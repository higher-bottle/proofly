<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Proofly smart contract architecture and value flow</title>
  <desc id="desc">A student interacts with the Proofly application and backend verification service. Signed claims authorize actions in ProoflyForum and ProoflyBadge. ProoflyForum controls HelpToken rewards and escrow. HelpToken returns HELP and ProoflyBadge returns achievement NFTs to the student.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9faf6"/>
    </linearGradient>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b2b78"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#28a89c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#281844" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#202020}.subtitle{font:400 21px Arial,sans-serif;fill:#5e5967}
      .nodeTitle{font:700 23px Arial,sans-serif;fill:#fff}.nodeBody{font:400 17px Arial,sans-serif;fill:#fff}
      .darkTitle{font:700 23px Arial,sans-serif;fill:#28242d}.darkBody{font:400 17px Arial,sans-serif;fill:#625d68}
      .label{font:600 16px Arial,sans-serif;fill:#4b2b78}.small{font:600 15px Arial,sans-serif;fill:#55505c}
      .flow{fill:none;stroke:#4b2b78;stroke-width:4;marker-end:url(#arrowPurple)}
      .claim{fill:none;stroke:#4b2b78;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowPurple)}
      .value{fill:none;stroke:#28a89c;stroke-width:4;marker-end:url(#arrowTeal)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="34" fill="url(#wash)"/>
  <circle cx="1270" cy="80" r="180" fill="#d9f7ef" opacity="0.55"/>
  <circle cx="100" cy="820" r="210" fill="#e7ddff" opacity="0.55"/>

  <text x="70" y="72" class="title">Proofly Smart Contract Architecture &amp; Value Flow</text>
  <text x="72" y="110" class="subtitle">The application authorizes educational context; the contracts enforce ownership, rewards, escrow, and achievements.</text>

  <!-- Student -->
  <g filter="url(#shadow)">
    <rect x="565" y="145" width="310" height="105" rx="24" fill="#4b2b78"/>
    <circle cx="625" cy="191" r="20" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M590 232c4-25 18-36 35-36s31 11 35 36" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="685" y="188" class="nodeTitle">Student</text>
    <text x="685" y="218" class="nodeBody">MetaMask wallet</text>
  </g>

  <!-- App and backend -->
  <g filter="url(#shadow)">
    <rect x="240" y="320" width="340" height="120" rx="24" fill="#4b2b78"/>
    <text x="280" y="369" class="nodeTitle">Proofly Application</text>
    <text x="280" y="401" class="nodeBody">Questions · profiles · learning data</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="860" y="320" width="340" height="120" rx="24" fill="#fff" stroke="#4b2b78" stroke-width="4"/>
    <text x="900" y="369" class="darkTitle">Backend Verification</text>
    <text x="900" y="401" class="darkBody">Account checks · eligibility · claims</text>
  </g>

  <!-- Smart contract enclosure -->
  <rect x="150" y="535" width="1140" height="230" rx="30" fill="#fff" fill-opacity="0.78" stroke="#28242d" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="515" y="507" width="410" height="55" rx="27" fill="#fff"/>
  <text x="720" y="544" text-anchor="middle" class="darkTitle">Sepolia Smart Contracts</text>

  <g filter="url(#shadow)">
    <rect x="205" y="603" width="310" height="105" rx="25" fill="#28a89c"/>
    <text x="360" y="646" text-anchor="middle" class="nodeTitle">ProoflyForum</text>
    <text x="360" y="677" text-anchor="middle" class="nodeBody">Lifecycle · escrow · settlement</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="565" y="603" width="310" height="105" rx="25" fill="#28a89c"/>
    <text x="720" y="646" text-anchor="middle" class="nodeTitle">HelpToken</text>
    <text x="720" y="677" text-anchor="middle" class="nodeBody">ERC-20 · rewards · purchase · expiry</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="925" y="603" width="310" height="105" rx="25" fill="#28a89c"/>
    <text x="1080" y="646" text-anchor="middle" class="nodeTitle">ProoflyBadge</text>
    <text x="1080" y="677" text-anchor="middle" class="nodeBody">ERC-721 achievement records</text>
  </g>

  <!-- Flow arrows -->
  <path d="M625 250 C540 275 480 292 425 320" class="flow"/>
  <text x="455" y="277" class="label">use Proofly</text>
  <path d="M580 380 L860 380" class="claim"/>
  <text x="720" y="364" text-anchor="middle" class="label">verify account and eligibility</text>
  <path d="M935 440 C830 490 565 515 405 603" class="claim"/>
  <text x="662" y="504" class="label">signed account action</text>
  <path d="M1060 440 C1080 485 1080 530 1080 603" class="claim"/>
  <text x="1093" y="510" class="label">signed mint claim</text>
  <path d="M515 655 L565 655" class="value"/>
  <path d="M565 680 L515 680" class="value"/>
  <text x="540" y="638" text-anchor="middle" class="small">mint</text>
  <text x="540" y="728" text-anchor="middle" class="small">escrow / payout</text>
  <path d="M685 603 C660 500 645 350 660 250" class="value"/>
  <text x="620" y="470" text-anchor="end" class="small">HELP rewards</text>
  <path d="M1110 603 C1065 470 905 330 820 250" class="value"/>
  <text x="1022" y="430" class="small">NFT badge</text>
  <path d="M760 250 C785 355 770 500 755 603" class="flow"/>
  <text x="785" y="466" class="small">ETH purchase + gas</text>

  <text x="70" y="844" class="subtitle">Key principle: the backend authorizes; the student's wallet submits; the smart contracts enforce.</text>
</svg>
